name: Python Tests

on:
  push:
    branches: [master]
    paths:
      - 'scripts/**'
      - 'requirements.txt'
  pull_request:
    branches: [master]
    paths:
      - 'scripts/**'
      - 'requirements.txt'

env:
  BLENDER_VERSION: "4.2.0"
  BLENDER_BASE_DIR: "${{ github.workspace }}/blender"

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov

      - name: Run unit tests with coverage
        run: |
          pytest scripts/tests/ -v \
            --ignore=scripts/tests/test_integration.py \
            --cov=scripts/blend_scanner \
            --cov-report=term-missing \
            --cov-report=html:coverage-report \
            --cov-report=xml:coverage.xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage-report/
          retention-days: 30

      - name: Upload coverage XML
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 30

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache Blender
        id: cache-blender
        uses: actions/cache@v4
        with:
          path: ${{ env.BLENDER_BASE_DIR }}
          key: blender-${{ env.BLENDER_VERSION }}-linux

      - name: Download and Install Blender
        if: steps.cache-blender.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$BLENDER_BASE_DIR"
          BLENDER_URL="https://download.blender.org/release/Blender${BLENDER_VERSION%.*}/blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          echo "Downloading Blender from: $BLENDER_URL"
          curl -L "$BLENDER_URL" | tar -xJ -C "$BLENDER_BASE_DIR" --strip-components=1

      - name: Setup Blender symlink
        run: |
          mkdir -p "$BLENDER_BASE_DIR"
          ln -sf "$BLENDER_BASE_DIR" "$BLENDER_BASE_DIR/../blender-ci"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run integration tests
        env:
          BLENDER_BASE_DIR: ${{ github.workspace }}/blender/..
        run: |
          pytest scripts/tests/test_integration.py -v
