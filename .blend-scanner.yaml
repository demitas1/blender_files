# Blend Scanner Configuration
# See docs/design-operation.md for details

blender:
  # Blender versions to use (in priority order)
  # The first available version will be used
  versions:
    - blender-4-LTS
    - blender-3-LTS
    - blender-5

  # Base directory containing Blender installations (REQUIRED)
  # Each version should be a subdirectory containing the blender executable
  # Example structure:
  #   ~/Application/blender/
  #   ├── blender-3-LTS/    # → contains blender executable
  #   ├── blender-4-LTS/    # → contains blender executable
  #   └── blender-5/        # → contains blender executable
  base_dir: ~/Application/blender

pre_commit:
  # Behavior when Blender is not found:
  #   error - Block commit (default, use SKIP_BLEND_SCAN=1 to override)
  #   warn  - Show warning and allow commit
  #   skip  - Silently skip scan
  no_blender: error

  # Scanners to run
  scanners:
    - malware
    - privacy
